$kind: http-request
url: "{{baseUrl}}/quartos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "numero": "Q999"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000
