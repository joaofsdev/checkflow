$kind: http-request
url: "{{baseUrl}}/quartos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "numero": "{{numeroQuarto}}",
      "tipo": "Casal com varanda"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('numeroQuarto', 'Q' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Retorna o quarto criado com status Livre', () => {
          pm.expect(body.numero).to.eql(pm.collectionVariables.get('numeroQuarto'));
          pm.expect(body.status).to.eql('Livre');
      });
      pm.collectionVariables.set('quartoId', body.id);
    language: text/javascript
order: 1000
