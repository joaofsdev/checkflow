$kind: http-request
url: "{{baseUrl}}/reservas/{{reservaId}}/checkout"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Reserva passa para Finalizado', () => {
          pm.expect(pm.response.json().status).to.eql('Finalizado');
      });
    language: text/javascript
order: 11000
