$kind: http-request
url: "{{baseUrl}}/reservas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "quarto_id": {{quartoReservaId}},
      "hospede_id": {{hospedeReservaId}},
      "data_checkin": "2026-11-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Mensagem de erro sobre reserva já existente', () => {
          pm.expect(pm.response.json().error).to.include('Já existe uma reserva');
      });
    language: text/javascript
order: 4000
