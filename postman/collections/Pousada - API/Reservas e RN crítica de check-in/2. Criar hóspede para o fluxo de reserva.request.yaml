$kind: http-request
url: "{{baseUrl}}/hospedes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "João Pereira",
      "documento": "{{documentoHospedeReserva}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('documentoHospedeReserva', 'H' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('hospedeReservaId', pm.response.json().id);
    language: text/javascript
order: 2000
