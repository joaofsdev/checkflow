$kind: http-request
url: "{{baseUrl}}/quartos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "numero": "{{numeroQuartoReserva}}",
      "tipo": "Casal"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('numeroQuartoReserva', 'R' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('quartoReservaId', pm.response.json().id);
    language: text/javascript
order: 1000
