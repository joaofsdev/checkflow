$kind: http-request
url: "{{baseUrl}}/reservas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "quarto_id": {{quartoReservaId}},
      "hospede_id": {{hospedeReservaId}},
      "data_checkin": "2026-11-05"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('reservaId2', pm.response.json().id);
    language: text/javascript
order: 9000
