$kind: http-request
url: "{{baseUrl}}/reservas/{{reservaId}}/checkin"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Mensagem de erro sobre check-in já realizado', () => {
          pm.expect(pm.response.json().error).to.include('já teve o check-in');
      });
    language: text/javascript
order: 8000
